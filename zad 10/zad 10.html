<body>
    <script>
        $(function(){
           $("#hide").click(function(){
            $("#1").hide();
        });
        $("#show").click(function(){
            $("#1").show();
        });
        $("#toggle").click(function(){
           $("#2").toggle(); 
        })
        $(".btn1").click(function(){
            $("#2").slideUp();
        });
        $(".btn2").click(function(){
            $("#3").slideDown();
        });
        $("button").click(function(){
            $("#3").slideToggle();
        });
        })
    </script>

<button id="hide">Hide</button>
<button id="show">Show</button>
<button id="toggle">Show</button>
